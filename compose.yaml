services:

  db:
    image: postgres
    container_name: loz_db_container
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    env_file:
      "./.env"
      
    volumes:
      - loz_db:/var/lib/postgresql/18/docker

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on: api
  api:
    build: ./backend/.
    ports:
      - 8081:8081
    depends_on: db
