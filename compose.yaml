
services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loz_db
    volumes:
      - loz_db:/var/lib/postgresql/18/docker

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  loz_db: